services:
  - type: web
    name: system-design-studio
    runtime: python
    region: singapore
    plan: free
    buildCommand: python --version && cd frontend && npm ci && npm run build && cd .. && python -m pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render defaults new services to Python 3.14; this pinned Pydantic core
      # release provides wheels for Python 3.13, avoiding an unsupported Rust build.
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: openai/gpt-oss-120b:fastest
      - key: CORS_ORIGINS
        value: https://system-design-studio.onrender.com
