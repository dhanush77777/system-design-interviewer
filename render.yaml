services:
  - type: web
    name: system-design-studio
    runtime: python
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd .. && python -m pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: openai/gpt-oss-120b:fastest
      - key: CORS_ORIGINS
        value: https://system-design-studio.onrender.com
